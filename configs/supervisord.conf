[supervisord]
nodaemon=true
logfile=/server/logs/supervisord.log
pidfile=/var/run/supervisord.pid
childlogdir=/server/logs

# Web Management Console. Published by docker-compose on 127.0.0.1:9001 only
# (use an SSH tunnel). Password comes from SUPERVISOR_PASSWORD in docker/.env.
[inet_http_server]
port=0.0.0.0:9001
username=admin
password=%(ENV_SUPERVISOR_PASSWORD)s

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=http://127.0.0.1:9001
username=admin
password=%(ENV_SUPERVISOR_PASSWORD)s

# Headless Virtual Display Server (Xvfb)
[program:xvfb]
command=Xvfb :99 -screen 0 1024x768x16 -nolisten tcp
priority=10
autostart=true
autorestart=true
stdout_logfile=/server/logs/xvfb_stdout.log
stderr_logfile=/server/logs/xvfb_stderr.log

# 1. Distribute Server (Authentication & Routing Gateway)
# WINEESYNC=1 enables eventfd-based synchronization bypassing wineserver lock bottlenecks
[program:distribute_server]
directory=/server/SWorking
command=wine DistributeServer.exe
environment=DISPLAY=":99",WINEPREFIX="/root/.wine",WINEDEBUG="-all",WINEESYNC="1"
priority=20
autostart=true
autorestart=true
startsecs=5
stdout_logfile=/server/logs/distribute_stdout.log
stderr_logfile=/server/logs/distribute_stderr.log

# 2. Agent Server (Player Session & State Management)
[program:agent_server]
directory=/server/SWorking
command=wine AgentServer.exe
environment=DISPLAY=":99",WINEPREFIX="/root/.wine",WINEDEBUG="-all",WINEESYNC="1"
priority=30
autostart=true
autorestart=true
startsecs=5
stdout_logfile=/server/logs/agent_stdout.log
stderr_logfile=/server/logs/agent_stderr.log

# 3. Map Servers: one program per map, generated at start-up by entrypoint.sh
[include]
files = /etc/supervisor/conf.d/maps.conf
