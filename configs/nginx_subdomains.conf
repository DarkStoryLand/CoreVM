# =========================================================================================
# DarkStory LAND - Nginx Enterprise Subdomain Reverse Proxy Configuration
# Subdomain Architecture: darkstoryland.com, bo, play, s, patch, api, billing
# =========================================================================================

# Upstream Backend Microservices (docker-compose service names; 127.0.0.1 would be
# the nginx container itself)
upstream web_portal {
    server web:3000 max_fails=3 fail_timeout=10s;
    keepalive 32;
}

upstream web_client_canvas {
    server webclient:8080 max_fails=3 fail_timeout=10s;
    keepalive 32;
}

# 1. Main Official Portal: darkstoryland.com & www.darkstoryland.com
server {
    listen 80;
    listen [::]:80;
    server_name darkstoryland.com www.darkstoryland.com;

    # Redirect HTTP to HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name darkstoryland.com www.darkstoryland.com;

    ssl_certificate /etc/letsencrypt/live/darkstoryland.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/darkstoryland.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    location / {
        proxy_pass http://web_portal;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# 2. Back-Office Admin & GM SOC Portal: bo.darkstoryland.com
server {
    listen 80;
    server_name bo.darkstoryland.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name bo.darkstoryland.com;

    ssl_certificate /etc/letsencrypt/live/darkstoryland.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/darkstoryland.com/privkey.pem;

    # The portal itself maps bo.* "/" to /bo/index.html, and BO pages load absolute
    # paths like /js/staff_auth.js and /api/bo/*, so proxy the host unchanged.
    location / {
        proxy_pass http://web_portal;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Optional: restrict the Back-Office to staff IPs
        # allow 203.0.113.10;
        # deny all;
    }
}

# 3. Play-in-Browser 3D Canvas: play.darkstoryland.com
server {
    listen 80;
    server_name play.darkstoryland.com play.dark;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name play.darkstoryland.com play.dark;

    ssl_certificate /etc/letsencrypt/live/darkstoryland.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/darkstoryland.com/privkey.pem;

    location / {
        proxy_pass http://web_client_canvas;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # WebSocket Support for In-game Chat & Movement
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 86400s;
    }
}

# 4. Auto-Patcher & CDN Distribution: patch.darkstoryland.com
server {
    listen 80;
    server_name patch.darkstoryland.com patch.dark;

    location / {
        proxy_pass http://web_portal/api/patch/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;

        # Cache manifest and binary chunks
        expires 1h;
        add_header Cache-Control "public, no-transform";
    }
}

# 5. Game Server WebSocket & Gateway: s.darkstoryland.com
server {
    listen 80;
    listen 443 ssl http2;
    server_name s.darkstoryland.com s.dark;

    ssl_certificate /etc/letsencrypt/live/darkstoryland.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/darkstoryland.com/privkey.pem;

    location /ws {
        proxy_pass http://web_client_canvas;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }
}

# 6. Central REST API Gateway: api.darkstoryland.com
server {
    listen 443 ssl http2;
    server_name api.darkstoryland.com;

    ssl_certificate /etc/letsencrypt/live/darkstoryland.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/darkstoryland.com/privkey.pem;

    location / {
        proxy_pass http://web_portal/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
