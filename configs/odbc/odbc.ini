# /etc/odbc.ini - unixODBC Configuration for DarkStory LAND
[ODBC Data Sources]
MHGame      = FreeTDS
MHCMember   = FreeTDS
MHLog       = FreeTDS

[MHGame]
Driver          = FreeTDS
Description     = DarkStory LAND Game Database
Servername      = MSSQLServer
Database        = MHGame
Port            = 1433
TDS_Version     = 7.4

[MHCMember]
Driver          = FreeTDS
Description     = DarkStory LAND Member/Auth Database
Servername      = MSSQLServer
Database        = MHCMember
Port            = 1433
TDS_Version     = 7.4

[MHLog]
Driver          = FreeTDS
Description     = DarkStory LAND Log Database
Servername      = MSSQLServer
Database        = MHLog
Port            = 1433
TDS_Version     = 7.4
